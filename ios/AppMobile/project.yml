# XcodeGen spec for the iOS app shell. The .xcodeproj is generated (gitignored): `./reflex app ios`.
# Text-based on purpose: agents edit this file, never a .pbxproj.
name: AppMobile
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppCore:
    path: ../Packages/AppCore
  IntrospectionKit:
    path: ../Packages/IntrospectionKit
targets:
  AppMobile:
    type: application
    platform: iOS
    sources: [AppMobile]
    dependencies:
      - package: AppCore
      # Used only by AppMobile/Debug (#if DEBUG). Release code never references it.
      - package: IntrospectionKit
        product: ReflexHost
    settings:
      base:
        # Placeholder identifier: change it when the product is decided.
        PRODUCT_BUNDLE_IDENTIFIER: app.reflex.mobile
        PRODUCT_NAME: Reflex
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
