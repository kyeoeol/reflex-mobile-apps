# The merge gate. Parity is enforced by tests: every behavior test runs on both platforms, and a PR that
# passes on only one cannot merge. Make the `gate` job a required status check on main.
name: reflex

on:
  pull_request:
  push:
    branches: [main]

env:
  REFLEX_SKIP_SETUP: "1" # CI installs its toolchain below instead of `./reflex setup`

jobs:
  check:
    name: Architecture lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: ./reflex check

  ios:
    name: iOS core + behavior tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Unit tests (primitives)
        run: cd ios/Packages/IntrospectionKit && swift test
      - name: Core builds headless on macOS
        run: cd ios/Packages/AppCore && swift build
      - name: Behavior tests (iOS)
        run: REFLEX_PLATFORMS=ios ./reflex test

  android:
    name: Android core + behavior tests
    runs-on: ubuntu-latest
    env:
      REFLEX_SKIP_APP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          # Caches ~/.gradle/caches and ~/.gradle/wrapper (keyed on the Gradle build files),
          # so CI doesn't re-download the Gradle distribution and dependencies every run.
          cache: gradle
      - name: Unit tests (primitives) + core builds on the plain JVM
        run: cd android && ./gradlew --no-configuration-cache test :core:build
      - name: Behavior tests (Android)
        run: REFLEX_PLATFORMS=android ./reflex test

  ios-app:
    name: iOS app shell builds
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: ./reflex app ios

  android-app:
    name: Android app shell builds (debug + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          # Caches ~/.gradle/caches and ~/.gradle/wrapper (keyed on the Gradle build files),
          # so CI doesn't re-download the Gradle distribution and dependencies every run.
          cache: gradle
      - run: cd android && ./gradlew :app:assembleDebug :app:assembleRelease

  gate:
    name: Parity gate
    needs: [check, ios, android, ios-app, android-app]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Both platforms pass the same behavior suite."
